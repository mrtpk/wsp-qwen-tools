[flake8]
# Research code, kept as it ran. Style codes are ignored; correctness codes are checked.
max-line-length = 160
extend-ignore = E501,E701,E702,E703,E731,E741,E302,E305,E401,E225,E226,E127,E128,E131,E201,E202,E203,E211,E221,E222,E231,E241,E251,E261,E262,E265,E266,E271,E272,E301,E303,E306,E402,E704,E711,E712,E713,E714,E722,W291,W293,W391,W503,W504,W605
# v2/codex/results and v2/codex/tasks hold code that the model wrote or that the tasks seed with faults: they are data.
# Kernel cells run inside the OpenWSP kernel, which injects load, save_edit, np, torch and the other helpers.
per-file-ignores =
    v2/cells/*:F821,F811,F401,F841
extend-exclude = .venv,v2/openwsp,v2/codex/results,v2/codex/tasks

[mypy]
ignore_missing_imports = True
# script folders are namespace packages (v1.bfcl.run_bfcl and v2.eval.run_bfcl are two modules)
namespace_packages = True
explicit_package_bases = True
# skills/ holds copies of tools/ scripts
exclude = (\.venv|skills|v2/openwsp|v2/cells|v2/codex/results|v2/codex/tasks)
